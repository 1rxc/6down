services:
  - type: web
    name: 6down-studio
    env: docker
    plan: standard
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 4
      - key: FILE_RETENTION_HOURS
        value: 2
      - key: PROXY_URL
        sync: false
      - key: COOKIES_CONTENT
        sync: false
      - key: PO_TOKEN
        sync: false
